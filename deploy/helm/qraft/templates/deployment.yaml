apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-semantic
data:
  semantic.yaml: |
{{ .Values.semantic | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: qraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env:
            - { name: QRAFT_MODEL, value: {{ .Values.config.model | quote }} }
            - { name: QRAFT_SEMANTIC, value: {{ .Values.config.semanticPath | quote }} }
            - { name: QRAFT_TRUST_IDENTITY_HEADERS, value: {{ .Values.config.trustIdentityHeaders | quote }} }
          volumeMounts: [{ name: semantic, mountPath: /config, readOnly: true }]
          readinessProbe: { httpGet: { path: /v1/health, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /v1/health, port: 8080 }, periodSeconds: 30 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: semantic
          configMap: { name: {{ .Release.Name }}-semantic }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 8080 }]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
