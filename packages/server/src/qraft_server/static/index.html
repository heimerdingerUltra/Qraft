<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qraft</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5.30.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0"></script>
<style>
  :root { --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #e3e3de;
          --ok: #1f7a4d; --warn: #9a6700; --bad: #b42318; --accent: #2f5bd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --ink: #ecece8; --quiet: #a3a39c; --line: #33332f;
            --ok: #4cc38a; --warn: #e3b341; --bad: #f97066; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--quiet); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }
  .q { font-weight: 600; margin-bottom: 8px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--quiet); font-size: 13px; }
  .badge { border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .vérifié { color: var(--ok); } .probable { color: var(--warn); } .incertain { color: var(--bad); }
  .note { color: var(--warn); font-size: 13px; margin: 4px 0; }
  .msg { white-space: pre-wrap; margin: 6px 0; }
  details summary { cursor: pointer; color: var(--quiet); font-size: 13px; margin-top: 8px; }
  pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  .tablewrap { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .chart { margin-top: 12px; width: 100%; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); }
  form .inner { max-width: 920px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--card); color: var(--ink); min-width: 0; }
  .followup { font-size: 13px; color: var(--quiet); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Qraft</h1>
  <p class="sub">Posez une question sur vos données. Une question qui commence par « et » prolonge la précédente.</p>
  <div id="thread"></div>
</main>
<form id="ask">
  <div class="inner">
    <input id="question" autocomplete="off" placeholder="Ex. : Chiffre d'affaires 2025 par région, du plus fort au plus faible">
    <label class="followup"><input type="checkbox" id="chain" checked> suite</label>
    <button class="primary" type="submit">Envoyer</button>
  </div>
</form>
<script>
const thread = document.getElementById("thread");
let previousId = null;

function el(tag, attrs = {}, text = "") {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text) node.textContent = text;
  return node;
}

function renderTable(card, columns, rows) {
  let wrap = card.querySelector(".tablewrap");
  if (!wrap) {
    wrap = el("div", { class: "tablewrap" });
    const table = el("table");
    const head = el("tr");
    columns.forEach(c => head.appendChild(el("th", {}, c)));
    table.appendChild(el("thead")).appendChild(head);
    table.appendChild(el("tbody"));
    wrap.appendChild(table);
    card.appendChild(wrap);
  }
  const body = wrap.querySelector("tbody");
  rows.slice(0, 200 - body.children.length).forEach(r => {
    const tr = el("tr");
    r.forEach(v => tr.appendChild(el("td", { class: typeof v === "number" ? "num" : "" },
      v === null ? "" : (typeof v === "number" ? v.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) : String(v)))));
    body.appendChild(tr);
  });
}

function addNotes(card, items) {
  (items || []).forEach(t => card.appendChild(el("div", { class: "note" }, "! " + t)));
}

async function feedback(id, rating, card) {
  await fetch(`/v1/questions/${id}/feedback`, { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ rating }) });
  card.querySelector(".actions").textContent = "Merci, retour enregistré.";
}

function ask(question) {
  const card = el("div", { class: "card" });
  card.appendChild(el("div", { class: "q" }, question));
  const meta = el("div", { class: "meta" }, "Interprétation en cours…");
  card.appendChild(meta);
  thread.appendChild(card);
  card.scrollIntoView({ behavior: "smooth", block: "end" });

  const params = new URLSearchParams({ q: question });
  if (document.getElementById("chain").checked && previousId) params.set("previous_id", previousId);
  const source = new EventSource(`/v1/questions/stream?${params}`);

  source.addEventListener("interpretation", e => {
    const d = JSON.parse(e.data);
    meta.textContent = "";
    card.appendChild(el("div", { class: "msg" }, d.text));
    (d.rules || []).forEach(r => card.appendChild(el("div", { class: "meta" }, "Règle appliquée : " + r)));
    addNotes(card, d.assumptions);
  });
  source.addEventListener("sql", e => {
    const details = el("details");
    details.appendChild(el("summary", {}, "Voir le SQL"));
    details.appendChild(el("pre", {}, JSON.parse(e.data).sql));
    card.appendChild(details);
  });
  source.addEventListener("rows", e => {
    const d = JSON.parse(e.data);
    renderTable(card, d.columns, d.rows);
  });
  source.addEventListener("chart", e => {
    const target = el("div", { class: "chart" });
    card.appendChild(target);
    const spec = JSON.parse(e.data);
    spec.width = "container";
    vegaEmbed(target, spec, { actions: false }).catch(() => target.remove());
  });
  source.addEventListener("confidence", e => {
    const c = JSON.parse(e.data);
    if (!c) return;
    meta.textContent = "";
    meta.appendChild(el("span", { class: `badge ${c.tier}` }, `${c.tier} · ${Math.round(c.score * 100)} %`));
    (c.reasons || []).forEach(r => meta.appendChild(el("span", {}, r)));
  });
  source.addEventListener("done", e => {
    const d = JSON.parse(e.data);
    previousId = d.id;
    addNotes(card, d.warnings);
    const actions = el("div", { class: "actions" });
    const up = el("button", { type: "button" }, "Juste");
    const down = el("button", { type: "button" }, "Faux");
    up.onclick = () => feedback(d.id, 1, card);
    down.onclick = () => feedback(d.id, -1, card);
    actions.append(up, down);
    card.appendChild(actions);
    source.close();
  });
  for (const kind of ["abstention", "clarification", "erreur"]) {
    source.addEventListener(kind, e => {
      const d = JSON.parse(e.data);
      meta.textContent = kind === "clarification" ? "Précision nécessaire" : (kind === "erreur" ? "Erreur" : "Pas de réponse fiable");
      card.appendChild(el("div", { class: "msg" }, d.message || ""));
      (d.alternatives || []).forEach(a => card.appendChild(el("div", { class: "note" }, "• " + a)));
      source.close();
    });
  }
  source.onerror = () => { if (meta.textContent.endsWith("…")) meta.textContent = "Connexion interrompue."; source.close(); };
}

document.getElementById("ask").addEventListener("submit", ev => {
  ev.preventDefault();
  const input = document.getElementById("question");
  const question = input.value.trim();
  if (question) { ask(question); input.value = ""; }
});
</script>
</body>
</html>
