[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qraft"
version = "0.1.0"
description = "Moteur Qraft : interprétation, compilation sémantique, exécution et vérification de questions en SQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=26",
    "sqlalchemy>=2.0.40",
    "msgspec>=0.19",
    "pyyaml>=6.0.2",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
claude = ["anthropic>=0.75"]
local = ["httpx>=0.27"]
duckdb = ["duckdb>=1.4", "duckdb-engine>=0.15"]
arrow = ["pyarrow>=17", "connectorx>=0.3"]
otel = ["opentelemetry-api>=1.25"]
dev = ["pytest>=8.4"]

[project.scripts]
qraft = "qraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
